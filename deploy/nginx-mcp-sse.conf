# Nginx configuration for MCP SSE Server
# Add this to your existing nginx configuration

# MCP SSE Server upstream
upstream mcp_sse_server {
    server 127.0.0.1:8100;
    keepalive 32;
}

# Add this location block to your existing server block
# or create a new server block for a subdomain

# Option 1: Add to existing server block under /mcp path
location /mcp/ {
    # Remove /mcp prefix when proxying
    rewrite ^/mcp/(.*) /$1 break;

    proxy_pass http://mcp_sse_server;
    proxy_http_version 1.1;

    # SSE specific headers
    proxy_set_header Connection '';
    proxy_set_header Cache-Control 'no-cache';
    proxy_set_header X-Accel-Buffering 'no';
    chunked_transfer_encoding on;

    # Standard proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeouts for long-lived connections
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;

    # Buffering
    proxy_buffering off;
    proxy_request_buffering off;
}

